packages:
  - "."

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - browserslist
  - fast-uri
  - sharp
  - brace-expansion
  - source-map-js
  - "@vue/server-renderer"
  - shell-quote

trustPolicy: no-downgrade

# Versiones pre-OIDC (semver@6.3.1, eslint-import-resolver-typescript@3.10.1) son
# anteriores a que el paquete adoptara provenance, y el check es por fecha de
# publicacion, no por semver. Se siguen verificando las publicadas en el ultimo ano.
trustPolicyIgnoreAfter: 525600

overrides:
  brace-expansion@1: "1.1.18"
  brace-expansion@2: "2.1.4"
  brace-expansion@5: "5.0.11"
  browserslist: "4.28.7"
  fast-uri: "3.1.7"
  ip-address: "10.5.0"
  js-yaml@3: "3.15.1"
  js-yaml@4: "4.3.1"
  js-yaml@5: "5.3.0"
  nanoid: "3.3.18"
  postcss: "8.5.26"
  sharp: "0.35.5"
  shell-quote: "1.11.0"
  source-map-js: "1.2.2"
  "@vue/server-renderer": "3.5.42"
  "vite@<8.1.6": "8.1.6"

# extract-zip 2.0.1 es la ultima publicada: el aviso no tiene version parcheada
# upstream. Solo entra por unlighthouse (devDependency), nunca a produccion.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": false
  esbuild: true
  puppeteer: false
  sharp: true
  unrs-resolver: true
  vue-demi: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
